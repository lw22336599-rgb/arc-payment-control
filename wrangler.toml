name = "arc-payment-control"
main = "src/index.js"
compatibility_date = "2026-07-28"

# D1 database for audit records
[[d1_databases]]
binding = "DB"
database_name = "arc-payment-db"
database_id = "e632cb95-fb7a-4327-ab3b-ae9d400df014"

# Environment variables
[vars]
ARC_TESTNET_RPC = "https://rpc.testnet.arc.io"
ARC_MAINNET_RPC = "https://rpc.mainnet.arc.io"
ARC_MAINNET_ENABLED = "false"
OWNER_WALLET = "0xf1437d9cd304ae49f2ec005ac967813b3a7c466c"
NETWORK = "testnet"
TIER_FREE_LIMIT = "1000"
PRICING = "free"
